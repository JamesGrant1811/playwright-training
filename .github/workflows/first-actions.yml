name: Test Project
on: 
  push:
   branches:
    - master
    - develop
  pull_request:
   branches:
    - master
    - develop
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD}}
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run ui tests
        run: npx playwright test e2e/tests/ui
      - name: Run api tests
        run: npx playwright test e2e/tests/api