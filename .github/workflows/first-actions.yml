name: Test Project
permissions:
  actions: write
  contents: read
on: 
  push:
   branches:
    - master
    - develop
  pull_request:
   branches:
    - master
    - develop
  workflow_dispatch:
    inputs:
      testType:
        description: 'Select test type (all, ui, api)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ui
          - api
      headless:
          description: 'Run in headless mode?'
          required: false
          default: true
          type: boolean    
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD}}
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install   
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run ui tests
        run: npx playwright test e2e/tests/ui/letsKodeItPracitceTests
      - name: Run api tests
        run: npx playwright test e2e/tests/api
      - name: Upload playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: cancelled()
        with:
            name: test-report
            path: test.json
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
  deploy: 
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Check dist folder
        run: ls playwright-report/
      - name: Output contents
        run: ls -R
      - name: Deploy
        run: echo "Deploying..."
